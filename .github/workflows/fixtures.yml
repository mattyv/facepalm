name: Fixtures

# Builds MediaPipe's face landmarker, and facepalm's shim over it, from source.
# Checks they reproduce MediaPipe's own expected results, and tests the shim
# against the real model, and holds facepalm's own adapter over the shim to
# MediaPipe's results. macOS only for now: the user will add Linux later
# (#3). A cold build takes half an hour on a runner, so it runs only when
# something it builds changes, or by hand. Bazel's compiled outputs are kept
# between runs, so a warm build compiles only what changed (#15).
on:
  pull_request:
    paths:
      - src/mediapipe_shim/**
      - src/face_model.*
      - src/approved_feed.*
      - src/client_token.*
      - src/daemon_control.*
      - CMakeLists.txt
      - tools/face_model_check/**
      - tools/daemon/**
      - tools/fixtures/**
      - .github/workflows/fixtures.yml
  push:
    branches: [main]
    paths:
      - src/mediapipe_shim/**
      - src/face_model.*
      - src/approved_feed.*
      - src/client_token.*
      - src/daemon_control.*
      - CMakeLists.txt
      - tools/face_model_check/**
      - tools/daemon/**
      - tools/fixtures/**
      - .github/workflows/fixtures.yml
  workflow_dispatch:

jobs:
  mediapipe:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: brew install bazelisk jq googletest ninja
      # Outside the checkout, by an absolute path: actions/cache rejects
      # one with "..", and the job's env cannot read the runner context.
      - name: Choose Bazel's disk cache
        run: echo "BAZEL_DISK_CACHE=${RUNNER_TEMP}/bazel-disk-cache" >>"${GITHUB_ENV}"
      # A run saves a new entry under its own commit; the next run restores
      # the newest one, from its own branch or from main.
      - uses: actions/cache@v6
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-disk-${{ runner.os }}-${{ github.sha }}
          restore-keys: bazel-disk-${{ runner.os }}-
      - name: Build MediaPipe and the fixture tool
        run: bash tools/fixtures/build.sh
      - name: Check against MediaPipe's expected results
        run: bash tools/fixtures/check_portrait.sh
      - name: Check the shim's exports and links
        run: bash tools/fixtures/check_shim.sh
      - name: Test the shim against the real model, with full coverage
        run: bash tools/fixtures/test_shim.sh
      - name: Hold the face model adapter to MediaPipe's own results
        run: |
          shim="${PWD}/build-mediapipe/mediapipe/bazel-bin/facepalm_shim"
          cmake -S . -B build -G Ninja \
            -DFACEPALM_MEDIAPIPE_DYLIB="${shim}/libfacepalm_mediapipe.dylib"
          cmake --build build --target face_model_check facepalm_daemon
          bash tools/fixtures/check_face_model.sh build/face_model_check
      - name: Check the daemon rejects an invalid invocation
        run: |
          status=0
          build/facepalm-daemon || status=$?
          test "$status" -eq 2
