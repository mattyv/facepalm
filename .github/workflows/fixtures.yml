name: Fixtures

# Builds MediaPipe's face landmarker, and facepalm's shim over it, from source.
# Checks they reproduce MediaPipe's own expected results, and tests the shim
# against the real model. macOS only for now: the user will add Linux later
# (#3). A cold build takes half an hour on a runner, so it runs only when
# something it builds changes, or by hand. Bazel's compiled outputs are kept
# between runs, so a warm build compiles only what changed (#15).
on:
  pull_request:
    paths:
      - src/mediapipe_shim/**
      - tools/fixtures/**
      - .github/workflows/fixtures.yml
  push:
    branches: [main]
    paths:
      - src/mediapipe_shim/**
      - tools/fixtures/**
      - .github/workflows/fixtures.yml
  workflow_dispatch:

jobs:
  mediapipe:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BAZEL_DISK_CACHE: ${{ github.workspace }}/../bazel-disk-cache
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: brew install bazelisk jq
      # A run saves a new entry under its own commit; the next run restores
      # the newest one, from its own branch or from main.
      - uses: actions/cache@v6
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-disk-${{ runner.os }}-${{ github.sha }}
          restore-keys: bazel-disk-${{ runner.os }}-
      - name: Build MediaPipe and the fixture tool
        run: bash tools/fixtures/build.sh
      - name: Check against MediaPipe's expected results
        run: bash tools/fixtures/check_portrait.sh
      - name: Check the shim's exports and links
        run: bash tools/fixtures/check_shim.sh
      - name: Test the shim against the real model, with full coverage
        run: bash tools/fixtures/test_shim.sh
