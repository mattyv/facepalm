name: Fixtures

# Builds MediaPipe's face landmarker from source and checks it reproduces
# MediaPipe's own expected results. macOS only for now: the user will add
# Linux later (#3). A cold build takes ten minutes or more, so it runs only
# when the fixture tool changes, or by hand.
on:
  pull_request:
    paths: [tools/fixtures/**, .github/workflows/fixtures.yml]
  push:
    branches: [main]
    paths: [tools/fixtures/**, .github/workflows/fixtures.yml]
  workflow_dispatch:

jobs:
  mediapipe:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: brew install bazelisk jq
      - name: Build MediaPipe and the fixture tool
        run: bash tools/fixtures/build.sh
      - name: Check against MediaPipe's expected results
        run: bash tools/fixtures/check_portrait.sh
      - name: Check the shim's exports and links
        run: bash tools/fixtures/check_shim.sh
