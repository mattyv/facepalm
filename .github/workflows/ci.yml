name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Style checks run on macOS only, with Homebrew's LLVM: clang-format and
  # clang-tidy versions differ between releases, and these match the ones
  # developers run locally.
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install tools
        run: brew install ninja googletest llvm bats-core shellcheck shfmt jq
      - name: Format
        run: |
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          cmake -S . -B build -G Ninja
          cmake --build build --target format-check
      - name: clang-tidy
        run: |
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          cmake -S . -B build-tidy -G Ninja -DFACEPALM_TIDY=ON \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++
          cmake --build build-tidy
          cmake --build build-tidy --target mcp_service_fixture
      - name: Shell
        run: |
          shellcheck scripts/*.sh scripts/test/*.bats \
            specs/*.sh specs/test/*.bats \
            tools/fixtures/*.sh tools/fixtures/test/*.bats \
            integrations/claude-code/*.sh integrations/claude-code/test/*.bats
          shfmt -d scripts/*.sh specs/*.sh tools/fixtures/*.sh \
            integrations/claude-code/*.sh
          bash scripts/check_bats.sh
          bats scripts/test specs/test tools/fixtures/test \
            integrations/claude-code/test
      - name: Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"
      - name: Tests and coverage
        run: bash scripts/coverage.sh

  # Also builds the Linux camera daemon and tests its two Linux sources,
  # against MediaPipe's C headers and libmediapipe.so, pinned by
  # scripts/mediapipe_c.sha256 and cached (#83). The tests fake MediaPipe and
  # libv4l2, so no camera is opened; libmediapipe.so needs EGL and GLES to
  # link.
  linux:
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      MEDIAPIPE_C: build-mediapipe-c
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bats clang jq libegl1 libgles2 libgmock-dev libgtest-dev \
            libv4l-dev llvm ninja-build unzip
      - uses: actions/cache@v6
        with:
          path: ${{ env.MEDIAPIPE_C }}
          key: mediapipe-c-${{ hashFiles('scripts/mediapipe_c.sha256') }}
      - name: Fetch MediaPipe's C headers and library
        run: bash scripts/fetch_mediapipe_c.sh "$MEDIAPIPE_C"
      - name: Tests and coverage, with the Linux daemon
        run: |
          bash scripts/coverage.sh \
            -DFACEPALM_MEDIAPIPE_C_INCLUDE="$PWD/$MEDIAPIPE_C/include" \
            -DFACEPALM_MEDIAPIPE_C_LIBRARY="$PWD/$MEDIAPIPE_C/lib/libmediapipe.so"
      - name: Check the daemon loads and rejects an invalid invocation
        run: |
          status=0
          build-coverage/facepalm-daemon || status=$?
          test "$status" -eq 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: MCP tests
        run: |
          npm ci --prefix mcp
          npm test --prefix mcp
          node --test integrations/claude-code/test/*.test.mjs
          bats integrations/claude-code/test
          cmake --build build-coverage --target mcp_service_fixture
          MCP_FIXTURE="$PWD/build-coverage/mcp_service_fixture" node --test test/integration/*.test.mjs
      - name: Portable install smoke
        run: |
          cmake -DSOURCE_DIR="$PWD" \
            -DSMOKE_ROOT="${RUNNER_TEMP}/facepalm-install-smoke" \
            -DMCP_NODE_MODULES="$PWD/mcp/node_modules" \
            -DMCP_FIXTURE="$PWD/build-coverage/mcp_service_fixture" \
            -P test/install_smoke.cmake
      - name: Script tests
        run: bats scripts/test specs/test tools/fixtures/test

  # Shell scripts' line coverage, with kcov over every bats test (#2), as
  # ai-pair measures it. Linux only: on macOS, kcov's bash tracing rides on
  # stderr, which bats captures. Debian packages kcov; Ubuntu 24.04 does not.
  shell-coverage:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bats binutils ca-certificates clang git jq kcov nodejs perl
      - uses: actions/checkout@v7
      # The scripts run git over files another user owns.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Shell coverage
        run: bash scripts/coverage_shell.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shell-coverage
          path: build-shell-coverage

  debian-package:
    runs-on: ubuntu-latest
    container: debian:13-slim
    steps:
      - name: Install build and desktop test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake dbus-daemon dpkg-dev file git \
            libgmock-dev ninja-build qt6-base-dev qt6-wayland xauth xdotool xvfb
      - uses: actions/checkout@v7
      - name: Build and exercise Linux tray
        run: |
          cmake -S . -B build-debian -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFACEPALM_LINUX_TRAY=ON
          cmake --build build-debian --target facepalm_menu gesture_replay_cli linux_tray_integration
          ctest --test-dir build-debian -R '^linux_tray_integration$' --output-on-failure --no-tests=error
      - name: Build Debian package
        run: cpack --config build-debian/CPackConfig.cmake -B build-debian/package
      - uses: actions/upload-artifact@v7
        with:
          name: facepalm-debian13-amd64
          path: build-debian/package/*.deb
          if-no-files-found: error

  debian-install:
    needs: debian-package
    runs-on: ubuntu-latest
    container: debian:13-slim
    steps:
      - name: Install package verification tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cmake desktop-file-utils git
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: facepalm-debian13-amd64
          path: debian-package
      - name: Install, run, and purge package
        run: |
          set -- "$PWD"/debian-package/*.deb
          test "$#" -eq 1
          cmake -DPACKAGE_FILE="$1" \
            -DSMOKE_ROOT="${RUNNER_TEMP}/facepalm-deb-smoke" \
            -DINSTALL_PACKAGE=ON -P test/deb_smoke.cmake

  # With the Linux camera's units too, as the linux job builds them.
  sanitizers:
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      MEDIAPIPE_C: build-mediapipe-c
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-dev libegl1 libgles2 libgmock-dev libgtest-dev \
            libv4l-dev llvm ninja-build unzip
      - uses: actions/cache@v6
        with:
          path: ${{ env.MEDIAPIPE_C }}
          key: mediapipe-c-${{ hashFiles('scripts/mediapipe_c.sha256') }}
      - name: Fetch MediaPipe's C headers and library
        run: bash scripts/fetch_mediapipe_c.sh "$MEDIAPIPE_C"
      - name: Tests with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build-sanitizers -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DFACEPALM_MEDIAPIPE_C_INCLUDE="$PWD/$MEDIAPIPE_C/include" \
            -DFACEPALM_MEDIAPIPE_C_LIBRARY="$PWD/$MEDIAPIPE_C/lib/libmediapipe.so"
          cmake --build build-sanitizers
          ctest --test-dir build-sanitizers --output-on-failure --no-tests=error

  # ThreadSanitizer cannot share a build with AddressSanitizer, so it has its
  # own (#66): the service, the feed and the client gate are threaded, and so
  # is the Linux camera's capture thread (#83).
  thread-sanitizer:
    runs-on: ubuntu-latest
    env:
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
      MEDIAPIPE_C: build-mediapipe-c
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-rt-dev libegl1 libgles2 libgmock-dev libgtest-dev \
            libv4l-dev llvm ninja-build unzip
      - uses: actions/cache@v6
        with:
          path: ${{ env.MEDIAPIPE_C }}
          key: mediapipe-c-${{ hashFiles('scripts/mediapipe_c.sha256') }}
      - name: Fetch MediaPipe's C headers and library
        run: bash scripts/fetch_mediapipe_c.sh "$MEDIAPIPE_C"
      # ThreadSanitizer fails to start under the 32 bits of mmap randomness
      # that newer kernels default to; 28 is what it supports.
      - name: Narrow address space randomization
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Tests with ThreadSanitizer
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DFACEPALM_MEDIAPIPE_C_INCLUDE="$PWD/$MEDIAPIPE_C/include" \
            -DFACEPALM_MEDIAPIPE_C_LIBRARY="$PWD/$MEDIAPIPE_C/lib/libmediapipe.so"
          cmake --build build-tsan
          ctest --test-dir build-tsan --output-on-failure --no-tests=error

  # Checks every TLA+ config, with TLC pinned as ai-pair's CI pins it.
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Download TLC
        run: |
          bash scripts/download_tlc.sh build-tla/tla2tools.jar \
            936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      - name: Check every spec
        run: bash specs/check.sh
