\* Two clients, three readings, a timeline that keeps two, one beat each,
\* every protection on. The cues are a nod, a shake and one of no feeling:
\* the rule treats a puzzled face as it does a nod or a shake, so two
\* feelings are enough for a conflict, and leaving it out keeps the state
\* space small. MaxLooks = 0 keeps #142's gaze inert here (Look never
\* fires, so it cannot grow the state space this config already needs);
\* Kinds is one element for the same reason -- the thinking guard needs
\* both kinds, and nothing else here cares which a beat is. FeelingBeat_
\* Gaze.cfg is the one config that spends the branching both would cost.

SPECIFICATION Spec

CONSTANTS
    Clients = {a, b}
    MaxReadings = 3
    Capacity = 2
    MaxBeats = 1
    Cues = {"nod", "shake", "other"}
    Kinds = {"question"}
    MaxLooks = 0
    GuardWindowStart = TRUE
    GuardDroppedUnknown = TRUE
    GuardConflictUnknown = TRUE
    GuardCloseBeat = TRUE
    GuardCancelOnLeave = TRUE
    GuardKeepBacklog = TRUE
    GuardAvertedUnknown = TRUE

INVARIANTS
    TypeOK
    OneAnswerPerBeat
    ReadsOnlyTheBeat
    UnknownWhenUnclear
    UnknownWhenIncomplete
    NoSilentGap
    NoRepeat
    CanAgree
    ContextNeverChangesFeeling
    ThinkingGuardFires

PROPERTIES
    BeatEnds

\* Once every reading is made and every beat marked, nothing need happen.
CHECK_DEADLOCK FALSE
