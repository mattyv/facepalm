\* Two clients and one restart of the helper, with every protection on, and
\* the default (built-in) device chosen.

SPECIFICATION Spec

CONSTANTS
    Clients = {c1, c2}
    MaxRestarts = 1
    ChosenOther = FALSE
    GuardOpenNeedsConsent = TRUE
    GuardRevokeCloses = TRUE
    GuardRevokeDiscards = TRUE
    GuardLastLeaveDiscards = TRUE
    GuardLastLeaveCloses = TRUE
    GuardEmitToSubscribers = TRUE
    GuardRestartRechecks = TRUE
    GuardStartChecksAttempt = TRUE
    GuardDiscoverAnyCamera = TRUE
    GuardTicketChecksCapture = TRUE
    GuardReopens = TRUE
    GuardChoosesByIdentity = TRUE
    GuardRetries = TRUE

INVARIANTS
    TypeOK
    OpenOnlyWithConsent
    OpenOnlyWhenSubscribed
    NoEventWithoutConsent
    NoEventToStranger
    DeadHelperHoldsNoCamera
    NoCaptureWhenClosed
    NoStaleEvent
    CapturesOnlyChosenDevice
    CanOpen

PROPERTIES
    RevokingCloses
    LastLeaveCloses
    WantedOpens

\* An idle camera with no clients can wait for one.
CHECK_DEADLOCK FALSE
