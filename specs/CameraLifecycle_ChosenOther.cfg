\* The same bounds as CameraLifecycle.cfg, with the person's choice the
\* other device (such as a Continuity Camera), not the default, to prove
\* the choice works symmetrically either way (#13).

SPECIFICATION Spec

CONSTANTS
    Clients = {c1, c2}
    MaxRestarts = 1
    ChosenOther = TRUE
    GuardOpenNeedsConsent = TRUE
    GuardRevokeCloses = TRUE
    GuardRevokeDiscards = TRUE
    GuardLastLeaveDiscards = TRUE
    GuardLastLeaveCloses = TRUE
    GuardEmitToSubscribers = TRUE
    GuardRestartRechecks = TRUE
    GuardStartChecksAttempt = TRUE
    GuardDiscoverAnyCamera = TRUE
    GuardTicketChecksCapture = TRUE
    GuardReopens = TRUE
    GuardChoosesByIdentity = TRUE
    GuardRetries = TRUE

INVARIANTS
    TypeOK
    OpenOnlyWithConsent
    OpenOnlyWhenSubscribed
    NoEventWithoutConsent
    NoEventToStranger
    DeadHelperHoldsNoCamera
    NoCaptureWhenClosed
    NoStaleEvent
    CapturesOnlyChosenDevice
    CanOpen

PROPERTIES
    RevokingCloses
    LastLeaveCloses
    WantedOpens

CHECK_DEADLOCK FALSE
