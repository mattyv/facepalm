\* Two clients, two interpretations, two feelings, one reset and one
\* restart, every protection on. Two feelings are enough: a correction is
\* an interpretation and a feeling, and what matters is which ones the
\* file and the reads hold.

SPECIFICATION Spec

CONSTANTS
    Clients = {a, b}
    MaxInterpretations = 2
    Feelings = {"agreement", "annoyance"}
    MaxResets = 1
    MaxRestarts = 1
    GuardGivenOnly = TRUE
    GuardOnce = TRUE
    GuardRecent = TRUE
    GuardOneWriter = TRUE
    GuardTempFile = TRUE
    GuardSyncBeforeRename = TRUE
    GuardAckDurable = TRUE
    GuardCommitOnRename = TRUE
    GuardResetEmpties = TRUE
    None = None
    Torn = Torn
    Clear = Clear

INVARIANTS
    TypeOK
    OnlyGiven
    OncePerInterpretation
    OnlyRecent
    NoTornFile
    ReadsTheFile
    AckedKept
    ResetForgets
    CanLearn

PROPERTIES
    Answered

\* Once every interpretation is given and answered, nothing need happen.
CHECK_DEADLOCK FALSE
