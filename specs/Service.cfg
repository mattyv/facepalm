\* Three connections, two client names, an approved token and a stranger's,
\* every protection on.

SPECIFICATION Spec

CONSTANTS
    Conns = {k1, k2, k3}
    Names = {a, b}
    None = None
    Tokens = {approved, stranger}
    ApprovedTokens = {approved}
    GuardApproval = TRUE
    GuardUniqueNames = TRUE
    GuardLeaveOnClose = TRUE
    GuardStopWakes = TRUE
    GuardRefuseWhenStopping = TRUE
    GuardHangUpWakes = TRUE

INVARIANTS
    TypeOK
    UniqueNames
    FeedMatchesConns
    StopWakesWaiters
    NothingAfterStop
    CanAccept
    ApprovedOnly
    ApprovedAdmitted

PROPERTIES
    StopEnds
    HangUpEnds

\* Once stopped, nothing need happen.
CHECK_DEADLOCK FALSE
