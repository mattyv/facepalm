\* Three clients, two of them approved, every protection on. The clients and
\* the OS queue at most two changes each at a time.

SPECIFICATION Spec

CONSTANTS
    Clients = {c1, c2, c3}
    Approved = {c1, c2}
    MaxQueue = 2
    GuardApproval = TRUE
    GuardFirstLast = TRUE
    GuardConsent = TRUE
    GuardStopRevokes = TRUE
    GuardStopRetires = TRUE
    GuardRetireOnce = TRUE
    GuardAckAfterRetire = TRUE
    GuardDeferDeviceBack = TRUE
    GuardOpenOnce = TRUE
    GuardNoDeviceRecovers = TRUE
    GuardFailureReported = TRUE
    GuardFailureReason = TRUE
    GuardRetries = TRUE

INVARIANTS
    NoDeviceDoesNotStop
    TypeOK
    ApprovedOnly
    OpenHasConsent
    SubscriptionMatches
    ReopenAfterRetire
    ExitClean
    FailureReported
    FirstFailure

PROPERTIES
    StopEnds
    LastLeaveCloses
    JoinOpens

\* Once the daemon has exited, nothing need happen.
CHECK_DEADLOCK FALSE
