\* One client, two readings, up to two Look steps: small enough to check
\* fast, but with every zone (on_content, averted, away, unknown) and both
\* kinds (question, proposal) reachable, so ContextNeverChangesFeeling and
\* ThinkingGuardFires (#142) are checked against a real state space, not
\* a vacuous one the way FeelingBeat.cfg's own MaxLooks = 0 leaves them.

SPECIFICATION Spec

CONSTANTS
    Clients = {a}
    MaxReadings = 2
    Capacity = 2
    MaxBeats = 1
    Cues = {"nod", "other"}
    Kinds = {"question", "proposal"}
    MaxLooks = 2
    GuardWindowStart = TRUE
    GuardDroppedUnknown = TRUE
    GuardConflictUnknown = TRUE
    GuardCloseBeat = TRUE
    GuardCancelOnLeave = TRUE
    GuardKeepBacklog = TRUE
    GuardAvertedUnknown = TRUE

INVARIANTS
    TypeOK
    ContextNeverChangesFeeling
    ThinkingGuardFires

\* Look and EndBeat may both stay forever enabled with nothing forcing
\* either; only the two gaze invariants matter here.
CHECK_DEADLOCK FALSE
